[package]
name = "costmap_planner_rs"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "costmap_planner_rs"
path = "src/lib.rs"

[[bin]]
name = "a_star"
path = "src/bin/a_star.rs"

[dependencies]
zenoh = "1.0.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
